[project]
name = "gb-power-forecast"
version = "0.1.0"
description = "Day-ahead forecasts of the GB half-hourly power price, tested walk-forward against simple baselines"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
