# Daily update: download the latest prices and forecasts, make tomorrow's
# forecast, save it to the prediction record, then republish the site.
# If any step fails, nothing is committed or published (the live site keeps its
# last good forecast) and GitHub emails the repository owner.
name: Daily forecast

on:
  schedule:
    - cron: "40 8 * * *" # every day at 08:40 UTC, after the 08:00 UTC cutoff
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # to commit the new forecast
  pages: write # for the deploy step
  id-token: write

# Never run two updates at once
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Run the tests
        run: pytest

      # Finished downloads never change, so keep them between runs
      # (the first run downloads everything, which takes about 15 minutes)
      - name: Reuse downloaded data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Download prices and forecasts
        run: python -m pipeline.data --start 2024-01-01

      - name: Make the forecast and write the site data
        run: python -m pipeline.export

      - name: Check everything before publishing
        run: python -m pipeline.check --since HEAD

      - name: Commit the new forecast
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data forecasts
          if git diff --cached --quiet; then
            echo "Nothing new today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily forecast ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
